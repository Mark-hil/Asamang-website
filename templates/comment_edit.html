{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Comment - {{ site_name }}{% endblock %}

{% block content %}
<main class="main">
    <div class="page-title">
        <div class="container">
            <h1>Edit Comment</h1>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body p-4">
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="id_name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="id_name" name="name" value="{{ form.name.value }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="id_email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="id_email" name="email" value="{{ form.email.value }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="id_body" class="form-label">Comment</label>
                                    <textarea class="form-control" id="id_body" name="body" rows="5" required>{{ form.body.value }}</textarea>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="id_active" name="active" {% if form.active.value %}checked{% endif %}>
                                    <label class="form-check-label" for="id_active">
                                        Active (uncheck to hide this comment)
                                    </label>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <a href="{% url 'core:blog_detail' post.slug %}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i> Cancel
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
